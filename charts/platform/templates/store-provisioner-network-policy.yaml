{{- $p := .Values.storeProvisioner | default dict -}}
{{- if and $p.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: store-provisioner-egress
spec:
  podSelector:
    matchLabels:
      app: store-provisioner
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - ipBlock:
            cidr: {{ $p.apiServer.serviceCidr | quote }}
      ports: [{protocol: TCP, port: 443}]
    - to:
        - ipBlock:
            cidr: {{ $p.apiServer.endpointCidr | quote }}
      ports:
        - protocol: TCP
          port: {{ $p.apiServer.endpointPort | int }}
    - to:
        - namespaceSelector:
            matchLabels:
              urumi.ai/managed-by: store-provisioner
            matchExpressions:
              - key: urumi.ai/store-id
                operator: Exists
          podSelector:
            matchLabels:
              app: wordpress
      ports: [{protocol: TCP, port: 80}]
    - to:
        - namespaceSelector:
            matchLabels:
              urumi.ai/managed-by: store-provisioner
            matchExpressions:
              - key: urumi.ai/store-id
                operator: Exists
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [woo-mcp, mcp-analytics]
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-store-provisioner
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: store-provisioner
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
      ports: [{protocol: TCP, port: 5432}]
{{- end }}
