[project]
name = "mcp-analytics"
version = "0.1.0"
description = "Read-only WooCommerce sales and order analytics over MCP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.12,<2",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
