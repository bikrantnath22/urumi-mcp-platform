{{- $gateway := .Values.gateway | default dict }}
{{- $dashboard := .Values.dashboard | default dict }}
{{- $names := list "postgres" }}
{{- if .Values.notes.enabled }}{{ $names = append $names "mcp-notes" }}{{ end }}
{{- if $gateway.enabled }}{{ $names = append $names "gateway" }}{{ end }}
{{- if $dashboard.enabled }}{{ $names = append $names "dashboard" }}{{ end }}
{{- range $name := $names }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ printf "%s-%s" $name $.Release.Name | trunc 63 | trimSuffix "-" }}
automountServiceAccountToken: false
{{- with $.Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
