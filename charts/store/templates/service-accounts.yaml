{{- $names := list "mysql" "wordpress" "woo-mcp" "store-bootstrap" }}
{{- if .Values.analytics.enabled }}{{ $names = append $names "mcp-analytics" }}{{ end }}
{{- range $name := $names }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ printf "%s-%s" $name $.Release.Name | trunc 63 | trimSuffix "-" }}
automountServiceAccountToken: false
{{- with $.Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
