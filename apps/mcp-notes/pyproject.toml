[project]
name = "mcp-notes"
version = "0.1.0"
description = "Shared team notes stored in PostgreSQL and exposed over MCP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.12,<2",
    "psycopg[binary,pool]>=3.2,<4",
    "starlette>=0.40,<2",
    "uvicorn>=0.30,<1",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
