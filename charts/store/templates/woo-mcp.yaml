apiVersion: v1
kind: Service
metadata:
  name: woo-mcp
  labels:
    app: woo-mcp
spec:
  type: ClusterIP
  selector:
    app: woo-mcp
  ports:
    - name: mcp
      port: {{ .Values.wooMcp.port }}
      targetPort: {{ .Values.wooMcp.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: woo-mcp
  labels:
    app: woo-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: woo-mcp
  template:
    metadata:
      labels:
        app: woo-mcp
    spec:
      serviceAccountName: {{ printf "woo-mcp-%s" .Release.Name | trunc 63 | trimSuffix "-" }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: woo-mcp
          image: {{ .Values.wooMcp.image }}
          imagePullPolicy: {{ .Values.wooMcp.pullPolicy }}
          ports:
            - containerPort: {{ .Values.wooMcp.port }}
          env:
            - name: PORT
              value: {{ .Values.wooMcp.port | quote }}
            - name: WOO_BASE_URL
              value: http://wordpress
            - name: WOO_HOST_HEADER
              value: {{ .Values.storeHost | quote }}
            - name: PUBLIC_STORE_URL
              value: {{ printf "%s://%s" .Values.storeScheme .Values.storeHost | quote }}
            - name: WC_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: WC_RW_KEY }
            - name: WC_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: WC_RW_SECRET }
            - name: WP_MEDIA_USER
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: WP_MEDIA_USER }
            - name: WP_MEDIA_APP_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: WP_MEDIA_APP_PASSWORD }
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.wooMcp.port }}
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.wooMcp.port }}
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.wooMcp.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
