[project]
name = "urumi-gateway"
version = "0.1.0"
description = "Authenticated MCP gateway, dashboard API and store provisioner."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "fastapi>=0.115,<1",
    "httpx>=0.28.1",
    "mcp[cli]>=1.12,<2",
    "psycopg[binary]>=3.2,<4",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn>=0.30,<1",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
