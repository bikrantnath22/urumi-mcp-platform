{{- $provisioner := .Values.storeProvisioner | default dict -}}
{{- $security := $provisioner.security | default dict -}}
{{- if hasKey $provisioner "enabled" -}}
{{- if not (kindIs "bool" $provisioner.enabled) -}}
{{- fail "storeProvisioner.enabled must be true or false." -}}
{{- end -}}
{{- end -}}
{{- if hasKey $security "enabled" -}}
{{- if not (kindIs "bool" $security.enabled) -}}
{{- fail "storeProvisioner.security.enabled must be true or false." -}}
{{- end -}}
{{- end -}}
{{- if hasKey $security "bindNamespaceRole" -}}
{{- if not (kindIs "bool" $security.bindNamespaceRole) -}}
{{- fail "storeProvisioner.security.bindNamespaceRole must be true or false." -}}
{{- end -}}
{{- end -}}
{{- if and $security.bindNamespaceRole (not $security.enabled) -}}
{{- fail "Enable and verify provisioner admission policies before binding its namespace role." -}}
{{- end -}}
{{- if and $provisioner.enabled (not (and $security.enabled $security.bindNamespaceRole)) -}}
{{- fail "The store provisioner requires enabled admission policies and its namespace role binding." -}}
{{- end -}}
{{- if $security.bindNamespaceRole }}
{{- $names := include "platform.storeProvisioner.names" . | fromJson }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $names.namespaceRole }}
  labels:
    app.kubernetes.io/name: store-provisioner
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $names.namespaceRole }}
subjects:
  - kind: ServiceAccount
    name: {{ $names.serviceAccount }}
    namespace: {{ .Release.Namespace | quote }}
{{- end }}
