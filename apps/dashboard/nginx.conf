server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API and MCP traffic will be routed directly to the gateway
    # by the Kubernetes ingress.
    location = /api {
        return 404;
    }

    location /api/ {
        return 404;
    }

    location = /mcp {
        return 404;
    }

    location /mcp/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
