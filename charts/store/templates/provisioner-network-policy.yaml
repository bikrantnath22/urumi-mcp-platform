{{- $release := .Values.provisionerRelease | default "" -}}
{{- if and .Values.networkPolicy.enabled .Values.guardrails.enabled $release }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wordpress-from-store-provisioner
spec:
  podSelector:
    matchLabels:
      app: wordpress
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.gatewayNamespace | quote }}
          podSelector:
            matchLabels:
              app: store-provisioner
              app.kubernetes.io/instance: {{ $release | quote }}
      ports: [{protocol: TCP, port: 80}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcps-from-store-provisioner
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [woo-mcp, mcp-analytics]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.gatewayNamespace | quote }}
          podSelector:
            matchLabels:
              app: store-provisioner
              app.kubernetes.io/instance: {{ $release | quote }}
      ports: [{protocol: TCP, port: 8000}]
{{- end }}
